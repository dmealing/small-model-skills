name: hygiene

# Public-repo leak gate: scans a PR's added lines for absolute local paths and
# private/other-project names. The scanner lives in .githooks/leak-scan.sh so its pattern
# literals don't self-trip. The private denylist is local-only, so CI enforces only the
# generic structural patterns (home paths) — private-name enforcement runs on your machine.

on:
  pull_request:

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Leak scan (added lines vs base)
        run: bash .githooks/leak-scan.sh "origin/${{ github.base_ref }}"
